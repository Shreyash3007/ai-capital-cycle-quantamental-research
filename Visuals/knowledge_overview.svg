  <rect x="268" y="536" width="173" height="44" rx="5" fill="#eaf3f8" stroke="#8bb7cc"/>
  <text x="354" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1f2d3a">SQL and data</text>
  <path d="M 447 558 L 471 558" stroke="#82909c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="481" y="536" width="173" height="44" rx="5" fill="#eaf3f8" stroke="#8bb7cc"/>
  <text x="567" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1f2d3a">External APIs</text>
  <path d="M 660 558 L 684 558" stroke="#82909c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="694" y="536" width="165" height="44" rx="5" fill="#eaf3f8" stroke="#8bb7cc"/>
  <text x="776" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1f2d3a">Research API</text>
  <path d="M 865 558 L 889 558" stroke="#82909c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="899" y="536" width="147" height="44" rx="5" fill="#eaf3f8" stroke="#8bb7cc"/>
  <text x="972" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1f2d3a">Review UI</text>

  <text x="40" y="635" font-family="Arial, sans-serif" font-size="16" fill="#52606d">Planned paths are not proof of completed implementation.</text>
