  <text x="532" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2d3a">Cost function</text>
  <path d="M 650 169 L 676 169" stroke="#82909c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="685" y="148" width="330" height="42" rx="5" fill="#e9f4ed" stroke="#82b394"/>
  <text x="850" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2d3a">Gradient descent</text>

  <text x="55" y="257" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f6b86">C1W2</text>
  <rect x="155" y="232" width="190" height="42" rx="5" fill="#eaf3f8" stroke="#8bb7cc"/>
  <text x="250" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1f2d3a">Multiple features</text>
