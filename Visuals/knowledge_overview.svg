<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Course, research, and engineering knowledge paths</title>
  <desc id="desc">C1W1 prediction, cost, and gradient descent; C1W2 multiple features, vectorization, scaling, and feature engineering; research phases P00 through P07; engineering from Python scripts through SQL, APIs, and an analyst workbench.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#82909c"/>
    </marker>
  </defs>
  <rect width="1100" height="650" fill="#f7f9fb"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2d3a">How the knowledge grows</text>
  <text x="40" y="77" font-family="Arial, sans-serif" font-size="18" fill="#52606d">Course topics are covered; project skills need learner-written, tested evidence.</text>

