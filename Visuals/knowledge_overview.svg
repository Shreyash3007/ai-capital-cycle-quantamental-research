  <text x="724" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2d3a">P05 Risk</text>
  <path d="M 786 403 L 805 403" stroke="#82909c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="813" y="379" width="112" height="48" rx="5" fill="#f2f5f7" stroke="#c5cdd5"/>
  <text x="869" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2d3a">P06 Book</text>
  <path d="M 931 403 L 950 403" stroke="#82909c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="958" y="379" width="88" height="48" rx="5" fill="#f2f5f7" stroke="#c5cdd5"/>
  <text x="1002" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2d3a">P07</text>

  <rect x="35" y="482" width="1030" height="130" rx="6" fill="#fff" stroke="#d2dbe3"/>
  <text x="55" y="514" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2d3a">Engineering grows with the research</text>
